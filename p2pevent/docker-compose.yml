services:
  db:
    image: postgres:16-alpine
    container_name: p2pevent-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-${DB_USERNAME:-postgres}}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-${DB_DATABASE:-pevent2p_db}}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
    driver: local